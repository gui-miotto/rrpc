how:
  label: The format
  heading: How a meeting works
  steps:
    - title: Pick the papers
      text: Papers are suggested and endorsed on Discord. One to three get selected per meeting.
    - title: Volunteer to present
      text: Each paper gets a presenter who walks everyone through the key ideas, methods and results.
    - title: Discuss together
      text: Every talk is followed by Q&A and an open discussion. Reading the papers beforehand is encouraged but not required.

