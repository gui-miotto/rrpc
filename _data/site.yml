about:
  label: The organiser
  heading: About me
  name: Gui
  body: |
    Hi, I'm Gui and I'm pleased to manage this event with the kind support of the organizations below.
    My main interests are robot learning (reinforcement learning, vision-language-action models, world models, etc.)
    and robot fleet deployment and management. Personally, I work on robotics for agriculture at
    [Bayer Crop Science](https://www.bayer.com/en/portfolio/agriculture/data-powered-agriculture/digital-farming){:target="_blank" rel="noopener"}.
    Feel free to connect with me on [Discord](https://discord.com/users/1222898874440745095){:target="_blank" rel="noopener"} or [LinkedIn](https://www.linkedin.com/in/gui-miotto/){:target="_blank" rel="noopener"}.

