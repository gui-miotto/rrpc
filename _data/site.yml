intro:
  label: What is a paper club?
  heading: A journal club for people who build robots
  body: |
    A paper club (or journal club) is a meeting where participants review interesting publications in a particular field. We agree on the papers beforehand and decide who will present them, followed by Q&A and open discussion.

    It's a great opportunity to gain in-depth technical knowledge, stay up to date with the field, meet people working on similar problems, and develop presentation skills. Meetings are in person and rotate around the Rhine region.

discord:
  label: Continue the conversation
  heading: Join us on Discord
  body: The club is organised on Discord. That's where meetings are announced and the reading list takes shape.
  points:
    - Suggest papers you'd like to discuss
    - Endorse other people's suggestions
    - Volunteer to present — including your own research
  link_text: discord.gg/WNvN9YQQh

