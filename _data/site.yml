  motto: Ideas on paper. Robots in the world.

about:
  label: The organiser
  heading: About me
  name: Gui
  body: |
    Hi, I'm Gui! I work in robotics at Bayer. I started the Rhine Robotics Paper Club to bring together people from academia and industry across the Rhine region who enjoy digging into robotics research — and to have a good excuse to read more papers.

    If you have a question, want to host a meeting, or would like to present, reach out on Discord.

